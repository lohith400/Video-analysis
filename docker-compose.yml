version: "3.9"

services:
  backend:
    build:
      context: ./backend
      # Swap to the CUDA base image for GPU inference (needs
      # nvidia-container-toolkit installed on the host):
      # args:
      #   BASE_IMAGE: nvidia/cuda:12.4.1-runtime-ubuntu22.04
    container_name: iris-backend
    ports:
      - "8000:8000"
    environment:
      - IRIS_API_KEY=${IRIS_API_KEY:-}
      - IRIS_CORS_ORIGINS=http://localhost:3000
    volumes:
      # Trained weights are gitignored on purpose (large binaries don't
      # belong in git) — mount them from the host instead.
      - ./backend/models:/app/models
      - ./backend/uploads:/app/uploads
      - ./backend/traffic_log.csv:/app/traffic_log.csv
    # Uncomment to pass through an NVIDIA GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: iris-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
