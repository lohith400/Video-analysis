name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install lightweight deps for lint/test
        # NOTE: torch/ultralytics/easyocr are heavy GPU-adjacent packages
        # that aren't needed to lint or run the pure-logic unit tests
        # (traffic_counter.py, tracker.py dataclasses). Installing the
        # full requirements.txt here would make CI slow and flaky on
        # shared runners, so this job intentionally scopes to what the
        # unit tests actually import.
        run: pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Run unit tests
        run: pytest test_traffic_counter.py test_plate_utils.py test_helmet_logic.py test_geometry_utils.py -v

  frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t iris-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t iris-frontend:ci ./frontend
